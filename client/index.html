<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#080C15" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noteeye — Drive-Style Note Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
      /* Zero-flash critical CSS for instant PWA pre-hydration launch */
      #pwa-prelaunch-splash {
        position: fixed;
        inset: 0;
        z-index: 99998;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #080C15;
        background-image: radial-gradient(circle at 50% 42%, #161D32 0%, #0C1222 55%, #050811 100%);
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #ffffff;
        user-select: none;
      }
      @keyframes noteeye-pulse-glow {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.18); opacity: 0.65; }
      }
      .prelaunch-glow {
        position: absolute;
        width: 112px;
        height: 112px;
        border-radius: 9999px;
        background: radial-gradient(circle, #863BFF 0%, #47BFFF 100%);
        filter: blur(28px);
        animation: noteeye-pulse-glow 2.8s ease-in-out infinite;
        pointer-events: none;
      }
      .prelaunch-logo {
        position: relative;
        z-index: 2;
        width: 80px;
        height: 80px;
        object-fit: contain;
        filter: drop-shadow(0 8px 24px rgba(134, 59, 255, 0.45));
      }
    </style>
  </head>
  <body class="bg-[#F8FAFD] text-[#1F1F1F] font-sans antialiased min-h-screen">
    <div id="root">
      <!-- 0ms Instant Native Pre-Hydration Splash (Replaced seamlessly when React mounts) -->
      <div id="pwa-prelaunch-splash" aria-hidden="true">
        <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
          <div class="prelaunch-glow"></div>
          <img src="/noteeye_logo.png" alt="Noteeye Logo" class="prelaunch-logo" />
        </div>
        <div style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: #ffffff;">Noteeye</div>
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #94A3B8; margin-top: 6px;">
          Calm Notes & Ideas · Workspace
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
